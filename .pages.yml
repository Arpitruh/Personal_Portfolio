# Edit using https://app.pagescms.org and choose feat/portfolio-world-nextjs
# Phase 15: upload only approved public photos and illustrations; keep originals private.
media:
  - name: images
    label: Future personal and project images
    input: public/uploads/images
    output: /uploads/images
    rename: safe
    extensions: [jpg, jpeg, png, webp]
  - name: personal-images
    label: Approved portrait and personal images
    input: public/uploads/images
    output: /uploads/images
    rename: safe
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
  - name: resumes
    label: Approved resume PDFs
    input: public/uploads/resumes
    output: /uploads/resumes
    rename: safe
    categories: [document]
    extensions: [pdf]
content:
  - name: identity
    label: Public profile
    type: file
    path: content/site.json
    fields:
      - {name: name, label: Name, type: string, required: true}
      - {name: initials, label: Initials, type: string, required: true}
      - {name: role, label: Current role, type: string, required: true}
      - {name: headline, label: Headline, type: string, required: true}
      - {name: location, label: Public location, type: string, required: true}
      - {name: summary, label: Professional summary, type: text, required: true}
      - {name: github, label: GitHub profile URL, type: string, required: true}
      - {name: email, label: Public contact email, type: string, required: true}
      - {name: phone, label: Public phone number, type: string}
  - name: experience
    label: Experience
    type: file
    path: content/experience.json
    fields:
      - name: roles
        label: Work history (newest first)
        type: object
        list: true
        fields:
          - {name: company, type: string, required: true}
          - {name: role, type: string, required: true}
          - {name: period, type: string, required: true}
          - {name: description, type: text, required: true}
          - {name: tags, label: Technologies, type: string, list: true}
  - name: projects
    label: Project case studies
    type: collection
    path: content/projects
    filename: "{fields.slug}.json"
    view:
      fields: [title, category, status, year, featured]
      primary: title
    fields:
      - {name: slug, label: URL slug (matches filename), type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"}
      - {name: title, type: string, required: true}
      - {name: kicker, type: string, required: true}
      - {name: summary, type: text, required: true}
      - name: category
        type: select
        required: true
        options: {values: [Products, Platform, AI, Frontend]}
      - name: status
        type: select
        required: true
        options: {values: [Building, Shipped, Iterating]}
      - {name: year, type: string, required: true}
      - {name: featured, label: Feature on homepage, type: boolean}
      - {name: emoji, type: string, required: true}
      - name: accent
        type: select
        required: true
        options: {values: [mint, peach, violet, blue, yellow]}
      - {name: stack, label: Technology stack, type: string, list: true}
      - {name: github, type: string, required: true}
      - {name: live, label: Verified live HTTPS URL, type: string}
      - {name: challenge, type: text, required: true}
      - {name: approach, type: text, required: true}
      - {name: highlights, type: string, list: true}
      - {name: next, label: Next checkpoint, type: text, required: true}
      - name: image
        label: Optional project image (use next phase)
        type: object
        fields:
          - name: src
            label: Image
            type: image
            options: {media: images}
          - {name: alt, label: Meaningful image description, type: text}
          - {name: caption, type: string}
  - name: skills
    label: Skills and tools
    type: file
    path: content/skills.json
    fields:
      - name: groups
        type: object
        list: true
        fields:
          - {name: group, type: string, required: true}
          - {name: items, type: string, list: true}
  - name: milestones
    label: Career milestones
    type: file
    path: content/milestones.json
    fields:
      - name: items
        type: object
        list: true
        fields:
          - {name: label, type: string}
          - {name: title, type: string}
          - {name: description, type: text}
  - name: life
    label: Beyond the Code
    type: file
    path: content/life.json
    fields:
      - {name: eyebrow, type: string}
      - {name: title, type: string, required: true}
      - {name: introduction, type: text, required: true}
      - {name: note, label: Personal note, type: text}
      - name: hobbies
        label: Hobbies and interests (add only when ready to share)
        type: object
        list: true
        fields:
          - {name: title, type: string, required: true}
          - {name: description, type: text, required: true}
          - {name: emoji, type: string}
  - name: socials
    label: Social and creative links
    type: file
    path: content/socials.json
    fields:
      - name: links
        label: Public profiles
        type: object
        list: true
        fields:
          - {name: name, type: string, required: true}
          - {name: url, type: string, required: true}
          - name: kind
            type: select
            options: {values: [Code, Professional, Photography, Social, Other]}
          - {name: visible, type: boolean}
  - name: resume
    label: Current resume
    type: file
    path: content/resume.json
    fields:
      - {name: label, type: string, required: true}
      - name: file
        label: Active PDF (public when published)
        type: file
        options:
          media: resumes
          categories: [document]
          extensions: [pdf]
      - {name: updated, label: Revision label or date, type: string}
      - {name: note, type: text}

  - name: visuals
    label: Portraits and personal photo gallery
    type: file
    path: content/visuals.json
    fields:
      - name: portrait
        label: Real portrait (About and personal page)
        type: object
        fields:
          - name: src
            label: Approved photo
            type: image
            options: {media: personal-images}
          - {name: alt, label: Description for screen readers, type: string}
          - {name: caption, label: Optional caption, type: string}
      - name: illustration
        label: Illustrated self (home and personal page)
        type: object
        fields:
          - name: src
            label: Approved illustration
            type: image
            options: {media: personal-images}
          - {name: alt, label: Description for screen readers, type: string}
          - {name: caption, label: Optional caption, type: string}
      - name: moments
        label: Approved personal moments (public gallery)
        type: object
        list: true
        fields:
          - {name: title, label: Card heading, type: string, required: true}
          - name: src
            label: Photograph or illustration
            type: image
            options: {media: personal-images}
          - {name: alt, label: Accurate photo description, type: string, required: true}
          - {name: caption, label: Short personal note, type: text}
          - name: category
            type: select
            options: {values: [Everyday, Places, Photography, Creative, Other]}
          - {name: featured, label: Highlight on personal page, type: boolean}
          - {name: visible, label: Approved for public display, type: boolean}

  - name: character-pack
    label: Illustrated Character Pack (Four Poses)
    type: file
    path: content/character-pack.json
    fields:
      - name: standing
        label: Standing character / Homepage
        type: object
        fields:
          - name: src
            type: image
            label: Standing WebP / PNG
            options: {media: personal-images}
          - {name: alt, type: string, label: Accessible image description}
          - {name: caption, type: string, label: Optional caption}
      - name: sitting
        label: Sitting with laptop / Projects
        type: object
        fields:
          - name: src
            type: image
            label: Laptop WebP / PNG
            options: {media: personal-images}
          - {name: alt, type: string, label: Accessible image description}
          - {name: caption, type: string, label: Optional caption}
      - name: coding
        label: Coding at desk / Skills
        type: object
        fields:
          - name: src
            type: image
            label: Coding WebP / PNG
            options: {media: personal-images}
          - {name: alt, type: string, label: Accessible image description}
          - {name: caption, type: string, label: Optional caption}
      - name: casual
        label: Casual personal life / Beyond the Code
        type: object
        fields:
          - name: src
            type: image
            label: Casual WebP / PNG
            options: {media: personal-images}
          - {name: alt, type: string, label: Accessible image description}
          - {name: caption, type: string, label: Optional caption}

<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--shell);color:var(--shellink);font-family:Nunito,system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px}
h1{font:12px 'Press Start 2P',monospace;margin:0;line-height:1.5}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
nav button{font:9px 'Press Start 2P',monospace;padding:9px 10px;border:2px solid var(--gold);background:transparent;color:var(--gold);border-radius:4px}
nav button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
main{flex:1;min-height:0;position:relative;overflow:auto}
section.view{display:none;height:100%}
section.view.on{display:block}
#map{position:relative;background:linear-gradient(var(--sky) 0 62%,#5cc16b 62%);min-height:380px;overflow:hidden}
#map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);border:3px solid var(--ink);background:var(--gold);color:var(--ink);border-radius:50%;width:54px;height:54px;font:14px 'Press Start 2P',monospace}
.node span{position:absolute;top:60px;left:50%;transform:translateX(-50%);white-space:nowrap;font:9px 'Press Start 2P',monospace;background:var(--ink);color:#fff;padding:5px 7px;border-radius:3px}
#me{position:absolute;width:22px;height:30px;transform:translate(-50%,-135%);transition:left .5s,top .5s;pointer-events:none;z-index:3}
#hint{position:absolute;left:12px;bottom:10px;background:var(--ink);color:#fff;padding:8px 10px;border-radius:4px;font-size:14px;max-width:80%}
#play{background:#000;text-align:center}
canvas{width:100%;max-width:960px;height:auto;image-rendering:pixelated;display:block;margin:0 auto;background:var(--sky)}
#pad{display:flex;justify-content:center;gap:10px;padding:10px}
#pad button{width:64px;height:52px;font:16px 'Press Start 2P',monospace;border-radius:8px;border:2px solid var(--gold);background:var(--ink);color:var(--gold);touch-action:none;user-select:none}
#play p{margin:4px 12px;font-size:14px;opacity:.85}
#quick{padding:18px;max-width:760px;margin:0 auto;height:auto}
#quick h2{font:12px 'Press Start 2P',monospace;color:var(--gold);margin:26px 0 10px;line-height:1.6}
#quick a{color:var(--gold)}
#ov{position:fixed;inset:0;background:rgba(10,8,30,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#ov.on{display:flex}
#box{background:var(--card);color:var(--cardink);border:4px solid var(--ink);border-radius:8px;max-width:520px;width:100%;max-height:85%;overflow:auto;padding:18px}

.pj{border-left:5px solid var(--pipe);padding:2px 0 2px 12px;margin:14px 0}
.tag{display:inline-block;background:var(--gold);color:var(--ink);font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;margin:2px 4px 2px 0}

@media (prefers-reduced-motion:reduce){#me{transition:none}}

<body>
<header>
<h1>YOUR NAME<br>portfolio world</h1>
<nav aria-label="Views">
<button data-v="map" aria-pressed="true">Map</button>
<button data-v="play" aria-pressed="false">Play level</button>
<button data-v="quick" aria-pressed="false">Quick view</button>
</nav>
</header>
<main>
<section id="map" class="view on" aria-label="World map">
<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline id="trail" fill="none" stroke="#f5deb3" stroke-width="1.6" stroke-dasharray="3 2" points=""/></svg>
<div id="me"><svg viewBox="0 0 11 15" width="22" height="30" shape-rendering="crispEdges"><rect x="2" y="0" width="7" height="3" fill="#14b8a6"/><rect x="2" y="3" width="7" height="4" fill="#f2c9a0"/><rect x="1" y="7" width="9" height="5" fill="#f97316"/><rect x="2" y="12" width="3" height="3" fill="#3b2f63"/><rect x="6" y="12" width="3" height="3" fill="#3b2f63"/></svg></div>

</section>
<section id="play" class="view" aria-label="Playable level">
<canvas id="cv" width="800" height="360" aria-label="Side-scrolling level"></canvas>
<p>Arrows or A/D to move, Space to jump, Down on a pipe to enter. Hit ? blocks from below, grab coins, reach the flag.</p>
<div id="pad"><button data-k="left" aria-label="Left">&lt;</button><button data-k="right" aria-label="Right">&gt;</button><button data-k="jump" aria-label="Jump">A</button><button data-k="down" aria-label="Enter pipe">v</button></div>
</section>
<section id="quick" class="view" aria-label="Quick view"></section>
</main>
<div id="ov" role="dialog" aria-modal="true" aria-labelledby="bt"><div id="box"><button id="x">Close</button><h2 id="bt"></h2><div id="bb"></div></div></div>

<script>

 {n:"Project One",d:"One line on what it does and the problem it solves.",t:["React","Node"],live:"#",code:"#"},

 contact:{t:"Contact",h:function(){return '<p>Level complete! Let’s work together.</p><p><a href="mailto:'+EMAIL+'">'+EMAIL+'</a></p><p><a href="'+LINKEDIN+'" target="_blank" rel="noopener">LinkedIn</a> &nbsp; <a href="'+GITHUB+'" target="_blank" rel="noopener">GitHub</a></p>'}}

 if(v==='play'&&!running){running=true;loop()}}

place(NODES[0]);
NODES.forEach(function(n){var b=document.createElement('button');b.className='node';b.style.left=n[2]+'%';b.style.top=n[3]+'%';
 b.innerHTML=n[1]+'<span>'+SEC[n[0]].t.split(' and ')[0]+'</span>';b.setAttribute('aria-label',SEC[n[0]].t);
 b.onclick=function(){place(n);setTimeout(function(){openS(n[0])},450)};map.appendChild(b)});

/* game */
var cv=document.getElementById('cv'),c=cv.getContext('2d'),W=3500,GY=300,running=false,cd=0,cam=0,coinsGot=0,pop=null;
var K={left:0,right:0,jump:0,down:0};

blk(300,190,'about');blk(2700,190,'exp');
[1350,1700,2050].forEach(function(x,i){S.push({x:x,y:GY-56,w:56,h:56,key:'pj'+i,pipe:1,lab:PROJECTS[i].n})});
for(var i=0;i<4;i++)S.push({x:2300+i*36,y:GY-(i+1)*24,w:36,h:(i+1)*24,step:1});
var COINS=SKILLS.map(function(s,i){return {x:560+i*110,y:214-(i%2)*30,n:s,got:0}});
var P={x:40,y:200,w:22,h:30,vx:0,vy:0,on:false,g:null,f:1};
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function step(){
 if(isOpen||view!=='play')return;if(cd>0)cd--;
 P.vx=(K.right-K.left)*3.4;if(P.vx)P.f=P.vx>0?1:-1;

 if(P.x>3200&&hit(P,{x:3200,y:100,w:30,h:200}))trig('contact');

}
function draw(){
 c.fillStyle='#6ec6ff';c.fillRect(0,0,800,360);
 c.fillStyle='#fff';[[100,60],[500,40],[900,80],[1400,50],[2000,70],[2700,45],[3200,75]].forEach(function(q){var x=q[0]-cam*.5;c.fillRect(x,q[1],70,16);c.fillRect(x+14,q[1]-12,40,14)});
 c.save();c.translate(-cam,0);
 c.fillStyle='#c8643c';c.fillRect(cam,GY,800,60);c.fillStyle='#5cc16b';c.fillRect(cam,GY,800,10);
 S.forEach(function(s){if(s.x+s.w<cam||s.x>cam+800||s.h===60)return;
  if(s.blk){c.fillStyle='#ffc83d';c.fillRect(s.x,s.y,32,32);c.strokeStyle='#8a5a00';c.lineWidth=3;c.strokeRect(s.x+1,s.y+1,30,30);c.fillStyle='#8a5a00';c.font='16px "Press Start 2P",monospace';c.fillText('?',s.x+8,s.y+23)}
  else if(s.pipe){c.fillStyle='#2fa84f';c.fillRect(s.x,s.y,s.w,s.h);c.fillStyle='#1f7a38';c.fillRect(s.x-4,s.y,s.w+8,14);c.fillStyle='#fff';c.font='8px "Press Start 2P",monospace';c.textAlign='center';c.fillText(s.lab,s.x+s.w/2,s.y-8);c.textAlign='left'}
  else{c.fillStyle='#a0522d';c.fillRect(s.x,s.y,s.w,s.h);c.strokeStyle='#6b3418';c.strokeRect(s.x,s.y,s.w,s.h)}});
 c.fillStyle='#1d1b3a';c.font='8px "Press Start 2P",monospace';c.fillText('ABOUT',282,180);c.fillText('EXPERIENCE',2650,180);c.fillText('SKILL COINS >',470,150);
 COINS.forEach(function(o){if(o.got)return;c.fillStyle='#ffc83d';c.beginPath();c.arc(o.x,o.y,9,0,7);c.fill();c.strokeStyle='#8a5a00';c.lineWidth=2;c.stroke()});
 c.fillStyle='#fff';c.fillRect(3216,110,5,190);c.fillStyle='#e11d48';c.fillRect(3221,114,34,22);c.fillStyle='#1d1b3a';c.fillText('CONTACT',3170,100);
 var x=P.x,y=P.y,f=P.f;c.fillStyle='#14b8a6';c.fillRect(x+3,y,16,7);c.fillRect(f>0?x+12:x-2,y+4,12,3);c.fillStyle='#f2c9a0';c.fillRect(x+3,y+7,16,9);c.fillStyle='#f97316';c.fillRect(x+1,y+16,20,8);c.fillStyle='#3b2f63';c.fillRect(x+3,y+24,7,6);c.fillRect(x+12,y+24,7,6);
 if(pop&&pop.l>0){c.fillStyle='#1d1b3a';c.fillText(pop.t,pop.x-20,pop.y-20-(70-pop.l)/3);pop.l--}
 c.restore();
 c.fillStyle='rgba(29,27,58,.85)';c.fillRect(8,8,200,24);c.fillStyle='#ffc83d';c.font='9px "Press Start 2P",monospace';c.fillText('SKILLS '+coinsGot+'/'+COINS.length,18,25);
}
function loop(){step();draw();requestAnimationFrame(loop)}
var map2={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',' ':'jump',ArrowUp:'jump',w:'jump',ArrowDown:'down',s:'down'};
addEventListener('keydown',function(e){var k=map2[e.key];if(k&&view==='play'&&!isOpen){K[k]=1;e.preventDefault()}});
addEventListener('keyup',function(e){var k=map2[e.key];if(k)K[k]=0});
document.querySelectorAll('#pad button').forEach(function(b){var k=b.dataset.k;
 b.addEventListener('pointerdown',function(e){e.preventDefault();K[k]=1});
 ['pointerup','pointerleave','pointercancel'].forEach(function(ev){b.addEventListener(ev,function(){K[k]=0})})});
</script>
<script>
/* ===== MARIO-FEEL UPGRADE ===== */
(function(){var st=document.createElement('style');st.textContent='#map{background:radial-gradient(circle at 18% 100%,#4fb35f 0 16%,transparent 16.3%),radial-gradient(circle at 55% 100%,#3fa152 0 22%,transparent 22.3%),radial-gradient(circle at 88% 100%,#4fb35f 0 17%,transparent 17.3%),linear-gradient(#6ec6ff 0 70%,#5cc16b 70%)}.node{border-radius:8px;box-shadow:0 5px 0 #8a5a00;transition:transform .15s}.node:hover{transform:translate(-50%,-58%)}.node span{top:66px}canvas{border:4px solid #ffc83d;border-radius:6px}';document.head.appendChild(st)})();
var AC,mute=false,mi=0,mt,sc=0,lives=3,inv=0,flDone=0,fl=0,pops=[],bumps={},fr=0;
function snd(f,d,ty,sl,v){if(mute||!AC)return;var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}
var NT=[262,330,392,330,294,349,440,349,262,330,392,523,494,392,330,392];
function initA(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();mt=setInterval(function(){if(view==='play'&&!isOpen)snd(NT[mi++%16],.18,'triangle',0,.04)},200)}
['keydown','pointerdown'].forEach(function(e){addEventListener(e,initA)});
var mb=document.createElement('button');mb.textContent='Sound: on';mb.onclick=function(){mute=!mute;mb.textContent='Sound: '+(mute?'off':'on')};document.querySelector('nav').appendChild(mb);
P.w=22;P.h=22;
var E=[760,980,1200,1500,1860,2200,2560,2900].map(function(x){return{x:x,y:GY-22,w:24,h:22,vx:-.8,k:0,gone:0}});
window.step=function(){
 if(isOpen||view!=='play')return;
 fr++;if(cd>0)cd--;if(inv>0)inv--;if(flDone&&fl<150)fl+=3;
 var t=(K.right-K.left)*3.6;P.vx+=(t-P.vx)*(t?.25:.18);if(Math.abs(P.vx)<.1)P.vx=0;if(P.vx)P.f=P.vx>0?1:-1;
 if(K.jump&&P.on){P.vy=-12;P.on=false;snd(380,.18,'square',900)}
 if(!K.jump&&P.vy<-4)P.vy=-4;
 P.vy=Math.min(P.vy+.55,12);
 P.x+=P.vx;S.forEach(function(s){if(hit(P,s))P.x=P.vx>0?s.x-P.w:s.x+s.w});
 P.x=Math.max(0,Math.min(W-P.w,P.x));
 P.y+=P.vy;P.on=false;P.g=null;
 S.forEach(function(s){if(hit(P,s)){if(P.vy>0){P.y=s.y-P.h;P.on=true;P.g=s}else if(P.vy<0){P.y=s.y+s.h;if(s.blk&&cd<=0){bumps[s.x]=10;pops.push({x:s.x+16,y:s.y,l:30});sc+=100;snd(988,.1,'square',1400);snd(1319,.25,'square',1319);trig(s.key)}}P.vy=0}});
 if(P.on&&P.g&&P.g.pipe&&K.down&&cd<=0){snd(200,.3,'sawtooth',60);trig(P.g.key)}
 for(var b in bumps){if(bumps[b]>0)bumps[b]--}
 COINS.forEach(function(o){if(!o.got&&hit(P,{x:o.x-10,y:o.y-10,w:20,h:20})){o.got=1;coinsGot++;sc+=50;snd(988,.08,'square',1319);snd(1319,.2,'square',1319);pop={t:o.n,x:o.x,y:o.y,l:70}}});
 E.forEach(function(e){if(e.gone)return;if(e.k){if(--e.k===0)e.gone=1;return}
  e.x+=e.vx;S.forEach(function(s){if(s.h!==60&&hit(e,s)){e.vx*=-1;e.x+=e.vx*3}});
  if(hit(P,e)){if(P.vy>1&&P.y+P.h-e.y<16){e.k=25;P.vy=-8;sc+=200;snd(300,.15,'square',80)}
   else if(!inv){lives--;inv=90;P.vy=-7;P.x-=P.f*30;snd(150,.4,'sawtooth',50);if(lives<=0){lives=3;P.x=40;P.y=200;sc=0}}}});
 if(!flDone&&P.x+P.w>3214&&P.x<3232){flDone=1;sc+=1000;snd(523,.2);snd(659,.4);trig('contact')}

};
var PAL={T:'#14b8a6',S:'#f2c9a0',K:'#1d1b3a',O:'#f97316',B:'#3b5bdb',N:'#5b3a1e'};

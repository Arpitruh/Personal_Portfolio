name: Portfolio quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependency vulnerabilities
        run: npm run audit:security
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Lighthouse lab audit
        run: npm run audit:lighthouse
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-quality-reports
          path: |
            artifacts/
            test-results/
            playwright-report/
          retention-days: 7
